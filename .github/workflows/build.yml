name: PPSSPP Libretro Windows DLL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: microsoft/setup-msbuild@v2

      - name: Build Libretro DLL
        shell: cmd
        run: |
          cd libretro
          
          echo "=== Building PPSSPP Libretro (Unicode) ==="
          
          make platform=windows_msvc2019_x64 ^
            MSVCCompileFlags="/DUNICODE /D_UNICODE /utf-8" ^
            V=1 -j2 2>&1 | tee build.log
          
          echo "=== Files generated ==="
          dir *.dll *.so *.exe

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ppsspp-libretro-windows
          path: |
            libretro/*.dll
            libretro/build.log
